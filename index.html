
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Solutions Hub</title>
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/png" href="/brand/Final%20Logo%20(1).png" />
    <link rel="apple-touch-icon" href="/brand/Final%20Logo%20(1).png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:image" content="/brand/Final%20Logo%20(1).png" />
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://esm.sh">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                300: '#FDE047',
                400: '#FACC15',
                500: '#EAB308',
                600: '#CA8A04',
                700: '#A16207'
              },
              brand: {
                dark: '#0F172A',
                navy: '#1e293b',
                blue: '#3b82f6',
                cyan: '#06b6d4',
                neon: '#00f3ff'
              }
            },
            fontFamily: {
              sans: ['Poppins', 'Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              cairo: ['Cairo', 'sans-serif'],
              urdu: ['Noto Nastaliq Urdu', 'serif']
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 7s infinite'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' }
              },
              blob: {
                "0%": {
                  transform: "translate(0px, 0px) scale(1)"
                },
                "33%": {
                  transform: "translate(30px, -50px) scale(1.1)"
                },
                "66%": {
                  transform: "translate(-20px, 20px) scale(0.9)"
                },
                "100%": {
                  transform: "translate(0px, 0px) scale(1)"
                }
              }
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6; 
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glass-light {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      /* Enhanced Form Styling */
      input, textarea, select {
        color: #ffffff !important;
      }
      
      input::placeholder, textarea::placeholder {
        color: #9ca3af !important;
        opacity: 1 !important;
      }
      
      select option {
        background-color: #0f172a;
        color: #ffffff;
      }
      
      select option:checked {
        background: linear-gradient(#06b6d4, #06b6d4);
        background-color: #3b82f6 !important;
        color: #ffffff;
      }
      
      /* Ensure select dropdown appears above other elements */
      select {
        position: relative;
        z-index: 10;
      }
      
      /* Enhanced Text Visibility */
      label {
        color: #d1d5db !important;
      }
      
      /* Responsive Improvements */
      @media (max-width: 768px) {
        select {
          font-size: 16px;
        }
      }
      
      /* Premium 3D Effects */
      .group:hover {
        transform: translateY(-4px);
      }
      
      /* Smooth transitions for all interactive elements */
      a, button, input, select, textarea {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Button hover effects */
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
      }
      
      button:active:not(:disabled) {
        transform: translateY(0px);
      }
      
      /* Link hover effects */
      a:hover {
        transform: translateY(-1px);
      }
      
      /* Focus states for better accessibility */
      input:focus, select:focus, textarea:focus {
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
      }
      
      /* Card hover effects */
      .rounded-xl:hover, .rounded-2xl:hover, .rounded-3xl:hover {
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      
      @media print {
        @page {
          size: A4 landscape;
          margin: 0;
        }
        html,
        body,
        #root {
          width: 297mm !important;
          height: 210mm !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          background: #fff !important;
        }
        body * {
          visibility: hidden;
        }
        #certificate-content, #certificate-content * {
          visibility: visible;
        }
        #certificate-content {
          position: fixed !important;
          left: 0 !important;
          top: 0 !important;
          width: 297mm !important;
          height: 210mm !important;
          max-width: none !important;
          max-height: none !important;
          transform: none !important;
          page-break-before: avoid !important;
          page-break-after: avoid !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
        #certificate-container,
        .certificate-sheet {
          overflow: hidden !important;
        }
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  
</head>
  <body class="bg-slate-950 text-white overflow-x-hidden selection:bg-cyan-500/30">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
